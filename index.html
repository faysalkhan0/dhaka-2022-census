<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Dhaka 2022 Census Explorer
    </title>

    <link
        href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

<div id="app">

    <header class="topbar">

        <div>
            <h1>
                Dhaka 2022 Census Explorer
            </h1>

            <p>
                Population, housing, demographic
                and SDG indicators
            </p>
        </div>

        <div class="source">
            Bangladesh Population and Housing
            Census 2022
        </div>

    </header>

    <main class="layout">

        <aside class="sidebar">

            <section>

                <label for="levelSelect">
                    Administrative level
                </label>

                <select id="levelSelect">

                    <option value="district">
                        District
                    </option>

                    <option value="city_corporation">
                        City Corporation
                    </option>

                    <option value="upazila">
                        Upazila / Thana
                    </option>

                    <option value="municipality">
                        Municipality
                    </option>

                    <option value="union_ward">
                        Union / Ward
                    </option>

                    <option value="mauza">
                        Mauza
                    </option>

                    <option value="village">
                        Village
                    </option>

                </select>

            </section>

            <section>

                <label for="indicatorSelect">
                    Indicator
                </label>

                <select id="indicatorSelect">
                </select>

            </section>

            <section>

                <label for="searchInput">
                    Search
                </label>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search location..."
                >

            </section>

            <section id="hierarchyPanel">

                <h2>
                    Location
                </h2>

                <div id="locationInfo">
                    Select an area on the map.
                </div>

            </section>

            <section id="statistics">

                <h2>
                    Statistics
                </h2>

                <div id="statValue">
                    —
                </div>

                <div id="statLabel">
                    —
                </div>

            </section>

        </aside>

        <section class="map-wrapper">

            <div id="map"></div>

            <div
                id="legend"
                class="legend"
            ></div>

            <button
                id="resetButton"
                class="map-button"
            >
                Reset
            </button>

        </section>

    </main>

</div>

<script src="./js/config.js"></script>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

<script src="./js/data.js"></script>
<script src="./js/map.js"></script>
<script src="./js/hierarchy.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>

</body>

</html>
